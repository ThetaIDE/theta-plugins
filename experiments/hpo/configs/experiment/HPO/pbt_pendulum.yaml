# @package _global_
defaults:
  - override /env: gym_classic_control/pendulum
paradigm: online_rl
no_plot: true
eval_episodes: 5
trainer:
  accelerator: cpu
tuning:
  component: pbt
  metric: eval/reward
  direction: maximize
  options:
    pbt:
      population: 4
      rounds: 5
      segment_transitions: 4096
      seed: 42
methods:
  ppo:
    model:
      name: basics/dnn
      sb3_native_policy: true
    agent:
      name: sb3/ppo
      n_steps: 256
      batch_size: 64
      n_epochs: 5
    tune:
      agent.learning_rate:
        type: log_float
        low: 0.0001
        high: 0.003
