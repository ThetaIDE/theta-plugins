# @package _global_
defaults:
  - override /env: gym_classic_control/pendulum
paradigm: online_rl
no_plot: true
eval_episodes: 5
trainer:
  accelerator: cpu
variability:
  training_runs: 2
  evaluation_seed: 1771
tuning:
  component: dehb
  metric: eval/reward
  direction: maximize
  options:
    dehb:
      min_transitions: 4096
      max_transitions: 16384
      reduction_factor: 2
      search_cap: 196608
      seed: 42
methods:
  ppo:
    model:
      name: basics/dnn
      sb3_native_policy: true
    agent:
      name: sb3/ppo
      n_steps: 256
      batch_size: 64
      n_epochs: 5
    tune:
      agent.learning_rate:
        type: log_float
        low: 0.0001
        high: 0.003
